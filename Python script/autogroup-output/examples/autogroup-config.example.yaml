# =============================================================================
# Autogroup - Self-contained example config
# =============================================================================
# Pairs with autogroup-output/examples/synthetic-assets.json so you can run
# autogroup end-to-end offline (no Phoenix credentials, no live API).
#
# Reproduce:
#   python run-phx.py \
#     --action_autogroup true \
#     --autogroup_mode batch \
#     --autogroup_config autogroup-output/examples/autogroup-config.example.yaml \
#     --autogroup_asset_source file \
#     --autogroup_asset_file autogroup-output/examples/synthetic-assets.json
#
# Result: a new autogroup-output/<timestamp>/ folder containing
#   - core-structure-*.yaml        (the schema-shaped YAML to upload)
#   - grouping-plan-*.yaml         (intermediate plan)
#   - tag-analysis-*.json          (tag coverage report)
#   - execution-report-*.json      (phase timings)
#   - autogroup.log                (JSON audit trail)
#   - checkpoints/                 (resume-points)

execution:
  mode: batch
  dry_run: false
  verbose: true
  resume_from_checkpoint: false  # examples should always start fresh
  asset_source: file
  asset_file: "autogroup-output/examples/synthetic-assets.json"

grouping:
  strategy: application_first
  primary_tags:
    - Application
    - application
    - app
    - service
  secondary_tags:
    - Team
    - team
    - owner
    - group
  use_high_frequency_fallback: true
  min_frequency_threshold: 1
  min_assets_per_component: 1
  max_assets_per_component: 1000
  only_unassigned: false

fallback:
  infra:
    cidr_grouping: true
    hostname_similarity_threshold: 0.8
  cloud:
    include_region: true
  container:
    name_similarity_threshold: 0.85

tag_mapping:
  mappings:
    application: [Application, application, app, service]
    team:        [Team, team, owner, responsible]
    costcenter:  [CostCenter, BU, business_unit, Department]
    environment: [Environment, environment, env, Name]

yaml_generation:
  enabled: true
  include_deployment_groups: true
  include_environment_groups: true
  output_path: "core-structure-{timestamp}.yaml"
  defaults:
    responsable: "ops@example.com"
    tier: 5
    status: "Autogenerated-phoenix"
    domain: ""
    subdomain: ""
    include_appid: false
    bu_suffix: ""
  asset_routing:
    deployment_group_types:
      - WEB
      - WEBSITE_API
      - REPOSITORY
      - SOURCE_CODE
      - BUILD
      - FOSS
      - SAST
    environment_group_types:
      INFRA:
        environment_type: INFRA
        environment_subtype: INFRA
      CLOUD:
        environment_type: CLOUD
        environment_subtype: CLOUD
      CONTAINER:
        environment_type: CLOUD
        environment_subtype: CLOUD

output:
  base_dir: "autogroup-output"
  export_yaml: true
  yaml_output_path: "created-components-{timestamp}.yaml"
  export_tag_analysis: true
  tag_analysis_path: "tag-analysis-{timestamp}.json"
  export_grouping_plan: true
  grouping_plan_path: "grouping-plan-{timestamp}.yaml"
  generate_report: true
  report_path: "execution-report-{timestamp}.json"

validation:
  allow_empty_output: false
  validate_names: true
  check_duplicates: true
  duplicate_strategy: skip
  api_rate_limit:
    enabled: false
    requests_per_second: 10
    pause_between_batches: 1

checkpoint:
  enabled: true
  folder: "checkpoints"
  tag_analysis_file: "checkpoint-01-tag-analysis.json"
  grouping_plan_file: "checkpoint-02-grouping-plan.yaml"
  max_checkpoint_age_hours: 168
